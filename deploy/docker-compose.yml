services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lp
      POSTGRES_DB: lp
    command: ["postgres", "-c", "max_connections=300", "-c", "max_wal_size=4GB"]
    ports:
      - "55432:5432"
    volumes:
      - lp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lp"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: lp-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

  # 可选: 对象存储(导出文件), pnpm compose:up --profile oss
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    profiles: ["oss"]

  # 可选: Kafka(Webhook/审计事件管线 P3 接入), pnpm compose:up --profile kafka
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    profiles: ["kafka"]

  # ===== 应用进程(profile: app) =====
  # 五个服务共用一个镜像, 由 command 区分; 与基础设施同网络, 用服务名互访。
  admin-api: &app
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    command: ["node", "apps/admin-api/dist/main.js"]
    environment: &app-env
      NODE_ENV: prod
      DATABASE_URL: postgresql://lp_app:${DB_PASSWORD:-lp}@postgres:5432/lp
      REDIS_URL: redis://redis:6379
      VAULT_ADDR: http://vault:8200
      PORT_ADMIN: 3001
      CODE_HMAC_KEY: ${CODE_HMAC_KEY:-dev-code-hmac-key-change-me}
      CODE_ENC_KEY: ${CODE_ENC_KEY:-dev-code-enc-key-change-me}
      FINGERPRINT_PEPPER: ${FINGERPRINT_PEPPER:-dev-fp-pepper}
      WEBHOOK_ENC_KEY: ${WEBHOOK_ENC_KEY:-dev-webhook-enc-key-change-me}
      NOTIFY_ADDR_ENC_KEY: ${NOTIFY_ADDR_ENC_KEY:-dev-notify-addr-enc-key-change-me}
      AUTH_JWT_KEYS_DIR: /app/data/keys
      NOTIFY_CONSOLE_FALLBACK: ${NOTIFY_CONSOLE_FALLBACK:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
    volumes:
      - lp_jwt_keys:/app/data/keys
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  client-api:
    <<: *app
    command: ["node", "apps/client-api/dist/main.js"]
    ports:
      - "3002:3002"

  open-api:
    <<: *app
    command: ["node", "apps/open-api/dist/main.js"]
    ports:
      - "3003:3003"

  portal-api:
    <<: *app
    command: ["node", "apps/portal-api/dist/main.js"]
    ports:
      - "3004:3004"

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    ports:
      - "3005:3005"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3005/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - admin-api
    restart: unless-stopped

volumes:
  lp_pgdata:
  lp_jwt_keys:
