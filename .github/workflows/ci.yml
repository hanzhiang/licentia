name: ci
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lp
          POSTGRES_DB: lp
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      TEST_DATABASE_URL: postgresql://lp_app:lp@localhost:55432/lp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck + build
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: Migrations (up on fresh db)
        run: pnpm db:migrate
      - name: Integration e2e (concurrency / idempotency / revocation)
        run: pnpm test:e2e
      - name: Migration rollback check
        run: pnpm db:rollback && pnpm db:migrate
